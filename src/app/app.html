<div class="main-container">
  <h1>CoinShift</h1>
  <p>Conversor de divisas</p>

  <div class="converter-card">
    <!-- Cantidad -->
    <div class="input-group">
      <label>Cantidad:</label>
      <input type="number" [(ngModel)]="amount" placeholder="0.00">
    </div>

    <!-- Divisa Origen -->
    <div class="input-group">
      <label>De:</label>
      <select [(ngModel)]="fromCurrency">
        <option value="USD">USD - Dólar Estadounidense</option>
        <option value="MXN">MXN - Peso Mexicano</option>
      </select>
    </div>

    <!-- Divisa Destino -->
    <div class="input-group">
      <label>A:</label>
      <select [(ngModel)]="toCurrency">
        <option value="MXN">MXN - Peso Mexicano</option>
        <option value="USD">USD - Dólar Estadounidense</option>
      </select>
    </div>

    <button (click)="convertir()">Convertir</button>

    <div class="result-area">
      <p>Resultado: <span id="resultValue">{{ result | number:'1.2-2' }}</span>
    </div>
  </div>
</div>
